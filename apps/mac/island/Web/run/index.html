<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
<meta name="color-scheme" content="light dark">
<title>Run</title>
<link rel="stylesheet" href="run.css">
</head>
<body>
<main id="run" aria-label="Run">
  <header>
    <h1>Run</h1>
    <p id="status" role="status" aria-live="polite"></p>
  </header>
  <p id="empty">No run yet. Send a message and its tool calls show here.</p>
  <section id="calls-section" hidden aria-labelledby="calls-title">
    <h2 id="calls-title">Tool calls</h2>
    <ol id="calls"></ol>
    <p id="omitted" hidden></p>
  </section>
  <section id="questions-section" hidden aria-labelledby="questions-title">
    <h2 id="questions-title">Questions</h2>
    <ul id="questions"></ul>
  </section>
  <section id="unavailable-section" hidden aria-labelledby="unavailable-title">
    <h2 id="unavailable-title">Not available yet</h2>
    <ul id="unavailable"></ul>
    <p class="note">ATOM's runtime does not report these yet. They show here when it does.</p>
  </section>
</main>
<script src="run.js"></script>
</body>
</html>
