[package]
name = "ark-app"
version = "0.0.1"
edition.workspace = true
publish = false
description = "Phase 3: the ARK app in Rust (ADR-278). A Rune window that talks to ark-runtime over the island protocol."
default-run = "ark-app"

[dependencies]
ark-protocol = { path = "../ark-protocol" }
ark-core = { path = "../ark-core" }
ark-ui = { path = "../ark-ui" }
# The same Rune features as ark-hello, and the Markdown component.
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }
rune-kit = { path = "../../vendor/rune/crates/rune-kit", features = ["markdown"] }
rune-theme-opencode = { path = "../../vendor/rune/themes/opencode" }
serde_json = "1"

# The status item has no Rune API: AppKit through objc2 (the versions Rune already locks).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
security-framework = "3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSThread", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSEvent", "block2", "NSRunningApplication", "NSView", "NSWindow"] }

[dev-dependencies]
png = "0.18"

[lints]
workspace = true
