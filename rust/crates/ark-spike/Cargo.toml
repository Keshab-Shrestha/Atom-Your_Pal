[package]
name = "ark-spike"
version = "0.0.1"
edition.workspace = true
publish = false
description = "Phase 0.2 spike checks (ADR-278): text input, windows, native views and accessibility next to Rune. Not shipped."

[dependencies]
# The same Rune features as ark-hello.
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }

# AppKit glue for the checks Rune has no API for (status item, .hudWindow, WKWebView).
# The versions Rune's dependencies already lock; only objc2-web-kit (Zlib OR Apache-2.0 OR MIT) is new.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry", "NSURL", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSButton", "NSControl", "NSGraphics", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKNavigation", "WKWebView", "WKWebViewConfiguration"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
