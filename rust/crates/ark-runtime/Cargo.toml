[package]
name = "ark-runtime"
version = "0.0.1"
edition.workspace = true
publish = false
description = "Phase 2: a forwarder between the Swift app and the Node runtime that answers some read-only commands itself (ADR-278)."

[dependencies]
ark-agent = { version = "0.0.1", path = "../ark-agent" }
ark-core = { version = "0.0.1", path = "../ark-core" }
ark-llm = { version = "0.0.1", path = "../ark-llm" }
ark-protocol = { version = "0.0.1", path = "../ark-protocol" }
ark-speech = { version = "0.0.1", path = "../ark-speech" }
ark-telegram = { version = "0.0.1", path = "../ark-telegram" }
jiff = "0.2"
libc = "0.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = "1"
sha2 = "0.10"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] } # exact floats: the usage dollars must read back the same
url = "2"
tract-onnx = "0.23" # the local sentence-embedding model (all-MiniLM-L6-v2, ONNX) of memory.keepChat, pure Rust
unicode-normalization = "0.1" # the BERT normalizer of that model
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true

[dev-dependencies]
ark-app = { path = "../ark-app" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
