[package]
name = "ark-hello"
version = "0.0.1"
edition.workspace = true
publish = false
description = "Phase 0 hello window: proves the Rune copy builds, draws headless and reports its tree."

[dependencies]
# Rune's defaults without `ogg-audio` (8 MPL-2.0 crates; ARK plays no audio through Rune)
# and `dbus` (Linux only).
rune = { path = "../../vendor/rune/crates/rune", default-features = false, features = ["accessibility", "embedded-fonts", "metal-backend", "svg"] }

[dev-dependencies]
png = "0.18"
serde_json = "1"

[lints]
workspace = true
